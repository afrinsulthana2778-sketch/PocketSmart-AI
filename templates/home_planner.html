{% extends "base.html" %}


{% block title %}

Home Planner — PocketSmart AI

{% endblock %}


{% block content %}


<section class="section-heading">

    <span class="eyebrow">
        HOME INTERIOR
    </span>


    <h1>
        Build your home plan
    </h1>


    <p>

        Tell the assistant your budget,
        rooms and requirements.

    </p>

</section>


<form
    id="homeForm"
    class="planner-form"
>


    <div class="form-grid">


        <label>

            Budget

            <input
                type="number"
                name="budget"
                min="1"
                step="100"
                required
                placeholder="50000"
            >

        </label>


        <label>

            Currency

            <input
                name="currency"
                value="INR"
                maxlength="3"
                required
            >

        </label>


        <label>

            Location

            <input
                name="location"
                value="Coimbatore"
            >

        </label>


    </div>


    <label>

        Rooms

        <small>

            One per line:
            Room Type, Quantity, Style

        </small>


        <textarea
            name="rooms"
            required
        >Living Room, 1, Modern
Bedroom, 1, Minimal</textarea>

    </label>


    <label>

        Requirements

        <small>
            Comma separated
        </small>


        <input
            name="requirements"
            value="lights, ceiling fan, storage"
        >

    </label>


    <button
        class="button primary"
        type="submit"
    >

        Generate Home Plan

    </button>


</form>


<div id="results"></div>


{% endblock %}


{% block scripts %}

<script>

document
    .getElementById("homeForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const formData =
                new FormData(
                    event.target
                );


            const rooms =
                formData
                    .get("rooms")
                    .split("\n")
                    .filter(Boolean)
                    .map(function(line) {

                        const parts =
                            line
                                .split(",")
                                .map(
                                    item =>
                                        item.trim()
                                );


                        return {

                            room_type:
                                parts[0],

                            quantity:
                                Number(
                                    parts[1]
                                    || 1
                                ),

                            style:
                                parts[2]
                                || "Modern",
                        };

                    });


            const payload = {

                budget:
                    Number(
                        formData.get(
                            "budget"
                        )
                    ),

                currency:
                    formData
                        .get("currency")
                        .toUpperCase(),

                location:
                    formData.get(
                        "location"
                    ),

                rooms:

                    rooms,

                requirements:

                    formData
                        .get(
                            "requirements"
                        )
                        .split(",")
                        .map(
                            item =>
                                item.trim()
                        )
                        .filter(Boolean),
            };


            const result =
                await api(
                    "/api/generate-home",
                    "POST",
                    payload
                );


            renderResult(result);

        }
    );

</script>

{% endblock %}
