{% extends "base.html" %}


{% block title %}

Register — PocketSmart AI

{% endblock %}


{% block content %}


<div class="auth-wrap">


    <form
        class="form-card"
        id="registerForm"
    >


        <span class="eyebrow">

            START PLANNING

        </span>


        <h1>

            Create account

        </h1>


        <label>

            Full name

            <input
                type="text"
                name="full_name"
                required
                minlength="2"
            >

        </label>


        <label>

            Email

            <input
                type="email"
                name="email"
                required
            >

        </label>


        <label>

            Password

            <input
                type="password"
                name="password"
                required
                minlength="8"
            >

        </label>


        <button
            class="button primary"
            type="submit"
        >

            Create account

        </button>


        <p
            id="formMessage"
            class="message"
        ></p>


        <p class="muted">

            Already registered?

            <a href="/login">
                Sign in
            </a>

        </p>


    </form>

</div>


{% endblock %}


{% block scripts %}

<script>

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const data =
                Object.fromEntries(
                    new FormData(event.target)
                );

            const result =
                await api(
                    "/api/register",
                    "POST",
                    data
                );

            if (result.ok) {

                window.location.href =
                    "/dashboard";

            } else {

                document
                    .getElementById(
                        "formMessage"
                    )
                    .textContent =
                        result.data.detail
                        ||
                        "Registration failed.";

            }

        }
    );

</script>

{% endblock %}
