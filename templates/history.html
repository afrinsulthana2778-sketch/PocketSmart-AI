{% extends "base.html" %}


{% block title %}

History — PocketSmart AI

{% endblock %}


{% block content %}

<section class="section-heading">

    <span class="eyebrow">
        SAVED PLANS
    </span>

    <h1>
        Recommendation history
    </h1>

</section>


<div
    id="history"
    class="history-grid"
>

    Loading…

</div>


<!-- PLAN DETAILS -->

<div
    id="plan-details"
    class="card plan-details-card"
    style="display: none;"
>

    <div class="details-header">

        <div>

            <span class="eyebrow">
                PLAN DETAILS
            </span>

            <h2 id="details-title">
                Recommendation Plan
            </h2>

        </div>


        <button
            type="button"
            class="close-details-btn"
            onclick="closePlanDetails()"
        >
            Close
        </button>

    </div>


    <div
        id="details-content"
        class="details-content"
    >

        Loading plan details…

    </div>

</div>


{% endblock %}


{% block scripts %}

<style>

/* ---------------------------------
   VIEW PLAN BUTTON
--------------------------------- */

.view-plan-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    margin-top: 12px;

    padding: 10px 18px;

    border: none;

    border-radius: 8px;

    background: #4f46e5;

    color: white;

    font-family: inherit;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;

}


.view-plan-btn span {

    font-size: 16px;

    transition:
        transform 0.2s ease;

}


.view-plan-btn:hover {

    background: #4338ca;

    transform: translateY(-1px);

    box-shadow:
        0 5px 12px rgba(
            79,
            70,
            229,
            0.20
        );

}


.view-plan-btn:hover span {

    transform: translateX(3px);

}


/* ---------------------------------
   PLAN DETAILS CARD
--------------------------------- */

.plan-details-card {

    margin-top: 35px;

    padding: 30px;

}


.details-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 25px;

}


.details-header h2 {

    margin-top: 8px;

}


.close-details-btn {

    padding: 9px 16px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    background: white;

    color: #374151;

    font-family: inherit;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition: all 0.2s ease;

}


.close-details-btn:hover {

    background: #f3f4f6;

}


/* ---------------------------------
   DETAILS CONTENT
--------------------------------- */

.details-content {

    line-height: 1.6;

}


.details-section {

    margin-bottom: 30px;

}


.details-section h3 {

    margin-top: 8px;

    margin-bottom: 15px;

}


.detail-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px, 1fr)
        );

    gap: 15px;

}


.detail-item {

    padding: 15px;

    border-radius: 10px;

    background: #f8f8fb;

    border: 1px solid #eeeeF2;

}


.detail-item strong {

    display: block;

    margin-bottom: 5px;

    font-size: 13px;

    color: #4f46e5;

}


.detail-item span {

    font-size: 15px;

    color: #222;

}


/* ---------------------------------
   RECOMMENDATION ITEMS
--------------------------------- */

.recommendation-item {

    padding: 18px;

    margin-bottom: 15px;

    border-radius: 12px;

    background: #f8f8fb;

    border: 1px solid #eeeeF2;

}


.recommendation-item h4 {

    margin: 0 0 8px 0;

    font-size: 17px;

}


.recommendation-item p {

    margin: 5px 0;

}


/* ---------------------------------
   MOBILE
--------------------------------- */

@media (max-width: 600px) {

    .details-header {

        align-items: flex-start;

        flex-direction: column;

    }


    .plan-details-card {

        padding: 20px;

    }


    .close-details-btn {

        width: 100%;

    }

}

</style>


<script>


/* ---------------------------------
   FORMAT LABEL
--------------------------------- */

function formatLabel(key) {

    return String(key)

        .replace(/_/g, " ")

        .replace(
            /\b\w/g,
            function(letter) {

                return letter.toUpperCase();

            }
        );

}


/* ---------------------------------
   ESCAPE HTML
--------------------------------- */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ---------------------------------
   FORMAT VALUE
--------------------------------- */

function renderValue(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "";

    }


    /* ARRAY */

    if (Array.isArray(value)) {

        if (!value.length) {

            return `
                <p>
                    No details available.
                </p>
            `;

        }


        return value
            .map(function(item) {

                if (
                    typeof item === "object" &&
                    item !== null
                ) {

                    return `

                        <div
                            class="recommendation-item"
                        >

                            ${renderObject(item)}

                        </div>

                    `;

                }


                return `

                    <div
                        class="recommendation-item"
                    >

                        ${escapeHtml(item)}

                    </div>

                `;

            })
            .join("");

    }


    /* OBJECT */

    if (
        typeof value === "object" &&
        value !== null
    ) {

        return renderObject(value);

    }


    /* NORMAL VALUE */

    return escapeHtml(value);

}


/* ---------------------------------
   FORMAT OBJECT
--------------------------------- */

function renderObject(object) {

    let html = `
        <div class="detail-grid">
    `;


    Object.entries(object)
        .forEach(function(entry) {

            const key = entry[0];

            const value = entry[1];


            html += `

                <div class="detail-item">

                    <strong>
                        ${escapeHtml(
                            formatLabel(key)
                        )}
                    </strong>

                    <span>

                        ${renderValue(value)}

                    </span>

                </div>

            `;

        });


    html += `
        </div>
    `;


    return html;

}


/* ---------------------------------
   OPEN PLAN DETAILS
--------------------------------- */

async function openPlanDetails(
    historyId
) {

    const detailsBox =
        document.getElementById(
            "plan-details"
        );


    const contentBox =
        document.getElementById(
            "details-content"
        );


    const titleBox =
        document.getElementById(
            "details-title"
        );


    detailsBox.style.display =
        "block";


    contentBox.innerHTML = `

        <p>
            Loading plan details…
        </p>

    `;


    try {

        const result =
            await api(
                "/api/recommendations-details/"
                + historyId
            );


        if (!result.ok) {

            contentBox.innerHTML = `

                <p>
                    Could not load this plan.
                </p>

            `;

            return;

        }


        const data =
            result.data;


        titleBox.textContent =
            formatLabel(
                data.planner_type
            )
            + " Recommendation";


        let html = "";


        /* ---------------------------------
           USER INPUT
        --------------------------------- */

        if (data.input) {

            html += `

                <section
                    class="details-section"
                >

                    <span class="eyebrow">
                        YOUR PLAN
                    </span>

                    <h3>
                        Planning Details
                    </h3>

                    ${renderObject(
                        data.input
                    )}

                </section>

            `;

        }


        /* ---------------------------------
           AI RESULT
        --------------------------------- */

        if (data.result) {

            html += `

                <section
                    class="details-section"
                >

                    <span class="eyebrow">
                        AI RECOMMENDATION
                    </span>

                    <h3>
                        Recommended Plan
                    </h3>

                    ${renderValue(
                        data.result
                    )}

                </section>

            `;

        }


        /* ---------------------------------
           CREATED DATE
        --------------------------------- */

        html += `

            <p
                style="
                    margin-top: 25px;
                    opacity: 0.65;
                "
            >

                Saved on:
                ${escapeHtml(
                    data.created_at
                )}

            </p>

        `;


        contentBox.innerHTML =
            html;


        detailsBox.scrollIntoView({

            behavior: "smooth",

            block: "start"

        });


    } catch (error) {

        console.error(
            "Plan details error:",
            error
        );


        contentBox.innerHTML = `

            <p>

                Something went wrong
                while loading the plan.

            </p>

        `;

    }

}


/* ---------------------------------
   CLOSE PLAN DETAILS
--------------------------------- */

function closePlanDetails() {

    const detailsBox =
        document.getElementById(
            "plan-details"
        );


    detailsBox.style.display =
        "none";

}


/* ---------------------------------
   LOAD HISTORY
--------------------------------- */

(async function() {

    const result =
        await api(
            "/api/history"
        );


    const box =
        document.getElementById(
            "history"
        );


    /* ERROR */

    if (!result.ok) {

        box.textContent =
            "Could not load history.";

        return;

    }


    /* EMPTY */

    if (
        !result.data.history.length
    ) {

        box.innerHTML = `

            <div
                class="empty card"
            >

                No saved recommendations yet.

            </div>

        `;

        return;

    }


    /* HISTORY CARDS */

    box.innerHTML =
        result.data.history

            .map(function(item) {


                const recommendations =
                    (
                        item.result &&
                        item.result.recommendations
                    )
                    || [];


                const count =
                    recommendations.length;


                const summary =
                    (
                        item.result &&
                        item.result.summary
                    )
                    ||
                    "Recommendation plan";


                return `

                    <article
                        class="card"
                    >

                        <span
                            class="eyebrow"
                        >

                            ${escapeHtml(
                                item.planner_type
                            )}

                        </span>


                        <h3>

                            ${escapeHtml(
                                summary
                            )}

                        </h3>


                        <p>

                            ${count}
                            recommendations
                            ·
                            ${escapeHtml(
                                item.created_at
                            )}

                        </p>


                        <button

                            type="button"

                            class="view-plan-btn"

                            onclick="
                                openPlanDetails(
                                    ${item.id}
                                )
                            "

                        >

                            View Plan Details

                            <span>
                                →
                            </span>

                        </button>


                    </article>

                `;

            })

            .join("");

})();

</script>

{% endblock %}
